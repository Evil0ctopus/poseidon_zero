name: Build CardputerZero ARM64 package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64-package:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install cross-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build crossbuild-essential-arm64 dpkg-dev

      - name: Configure, build, and package
        run: cmake --workflow --preset cp0-cross-package

      - name: Validate store metadata and package
        run: |
          package="$(find dist -maxdepth 1 -name 'poseidon-zero_*_arm64.deb' -print -quit)"
          test -n "$package"
          cmake \
            -DPROJECT_ROOT="$GITHUB_WORKSPACE" \
            -DPACKAGE_FILE="$package" \
            -P .agents/skills/cardputerzero-package-release/scripts/validate_app_builder.cmake

      - name: Inspect ARM64 package
        run: |
          package="$(find dist -maxdepth 1 -name 'poseidon-zero_*_arm64.deb' -print -quit)"
          test -n "$package"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package"

      - name: Upload ARM64 package
        uses: actions/upload-artifact@v4
        with:
          name: poseidon-zero-arm64
          path: dist/*.deb
          if-no-files-found: error
