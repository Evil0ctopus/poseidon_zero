name: Build CardputerZero ARM64 package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64-package:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install cross-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build crossbuild-essential-arm64 cpack dpkg-dev

      - name: Configure, build, and package
        run: cmake --workflow --preset cp0-cross-package

      - name: Inspect ARM64 package
        run: |
          test -n "$(find dist -maxdepth 1 -name 'POSEIDON-Zero_*_arm64.deb' -print -quit)"
          dpkg-deb --info "$(find dist -maxdepth 1 -name 'POSEIDON-Zero_*_arm64.deb' -print -quit)"
          dpkg-deb --contents "$(find dist -maxdepth 1 -name 'POSEIDON-Zero_*_arm64.deb' -print -quit)"

      - name: Upload ARM64 package
        uses: actions/upload-artifact@v4
        with:
          name: poseidon-zero-arm64
          path: dist/*.deb
          if-no-files-found: error
