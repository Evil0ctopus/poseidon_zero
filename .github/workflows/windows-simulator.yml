name: Build Windows CardputerZero simulator

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-simulator:
    runs-on: windows-2022

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up MSVC Developer Command
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: Configure Windows simulator
        shell: pwsh
        run: cmake --preset win32-msvc

      - name: Build Windows simulator
        shell: pwsh
        run: cmake --build --preset win32-msvc-dbg --parallel 2

      - name: Upload Windows simulator
        uses: actions/upload-artifact@v4
        with:
          name: poseidon-zero-windows-simulator
          path: build/msvc/Debug/*
          if-no-files-found: error
